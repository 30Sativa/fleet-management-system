# Phase 4 person perception. Every number here should be a measured one.
person_perception:
  ros__parameters:
    # Absolute path to the exported OpenVINO IR. Export on a laptop:
    #   yolo export model=yolo26n.pt format=openvino imgsz=320 int8=True
    model_xml: ""
    device: "CPU"            # try "GPU" once; HD 630 is Gen9.5 and often fails
    imgsz: 320
    inference_threads: 2     # of 4. Leave the rest to nav2_controller.
    conf_threshold: 0.45
    iou_threshold: 0.5
    rate_hz: 5.0             # raise only if bench_detector.py says there is room

    camera_name: "camera"
    base_frame: "base_link"
    stale_after_s: 1.5

    publish_speed_limit: true
    slow_zone_m: 3.0         # person nearer than this, inside the cone -> slow
    cone_half_deg: 35.0      # roughly the RGB horizontal half-FOV
    slow_speed_percent: 40.0 # never 0 - see _policy() in the node
    report_period: 5.0
