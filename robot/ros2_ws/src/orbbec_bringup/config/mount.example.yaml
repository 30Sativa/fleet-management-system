# Copy this file to mount.yaml and fill in values measured from base_link.
# ROS convention: x forward, y left, z up; rotation order is roll, pitch, yaw.
# Do not use this file directly as a vendor camera-driver parameter file.
camera_mount:
  parent_frame: base_link
  child_frame: camera_link
  x_m: 0.0
  y_m: 0.0
  z_m: 0.0
  roll_rad: 0.0
  pitch_rad: 0.0
  yaw_rad: 0.0
