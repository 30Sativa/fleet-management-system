simple_frontier_explorer:
  ros__parameters:
    map_topic: /map
    mode_state_topic: /robot_mode_state
    emergency_stop_state_topic: /emergency_stop_state
    navigate_action: navigate_to_pose
    global_frame: map
    robot_base_frame: base_footprint
    explore_period: 2.0
    goal_timeout: 45.0
    goal_accept_timeout: 5.0
    free_threshold: 25
    occupied_threshold: 65
    # Loosened so exploration can bootstrap from a small initial map:
    #  - small clusters (>=3 cells) still count as a frontier
    #  - goals just 0.2 m away are allowed so the robot starts moving early
    min_frontier_size: 4
    min_goal_distance: 0.4
    # Higher weight = prefer bigger open frontiers over tiny ones tucked in
    # corners, so the robot spends less time wedging into dead-end nooks.
    cluster_size_weight: 0.15
