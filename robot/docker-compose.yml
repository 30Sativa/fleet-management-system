# Một compose file duy nhất cho cả hai máy.
#
# MỌI service đều nằm sau một profile, nên `docker compose up` trần sẽ KHÔNG
# khởi động gì cả. Đó là chủ ý: trên VMware không thể vô tình start service
# hardware và gặp lỗi "/dev/ttyACM0: no such file or directory".
#
#   miniPC (phần cứng thật): docker compose --profile hardware up -d
#   VMware (RViz2 / debug) : docker compose --profile debug    up -d
#
# Chỉ service `robot-ros2` được phép khai báo `devices:`. Anchor bên dưới cố ý
# chỉ chứa biến môi trường ROS chung, không chứa devices/volumes, nên service
# debug không thể kế thừa serial device từ service hardware.

x-ros2-env: &ros2-env
  # miniPC và VMware PHẢI dùng cùng domain. Hệ thống này dùng 30.
  ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-30}"
  RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
  ROS_LOCALHOST_ONLY: "${ROS_LOCALHOST_ONLY-0}"
  # MẶC ĐỊNH RỖNG = DDS multicast discovery bình thường. KHÔNG tự bật Fast DDS
  # Discovery Server.
  #
  # Dùng `${VAR-}` chứ KHÔNG phải `${VAR:-...}`: dạng `:-` fallback cả khi biến
  # rỗng, nên `ROS_DISCOVERY_SERVER=` trong .env sẽ bị nuốt và thay bằng default.
  # Dạng `-` chỉ fallback khi biến chưa tồn tại, nên rỗng thực sự là rỗng.
  #
  # Chỉ điền khi thật sự chạy `fastdds discovery --server-id 0` trên miniPC:
  #   ROS_DISCOVERY_SERVER=<MINIPC_LAN_IP>:11811   (đặt trong .env, không hard-code ở đây)
  ROS_DISCOVERY_SERVER: "${ROS_DISCOVERY_SERVER-}"

services:
  # ---------------------------------------------------------------- miniPC --
  # Chạy phần cứng thật: STM32, RPLiDAR, gamepad.
  robot-ros2:
    profiles: [hardware]
    image: ${DOCKER_IMAGE:-307sativa/robot-ros2:latest}
    container_name: robot-ros2
    network_mode: host
    # Giai đoạn TEST: tắt auto-restart để bạn hoàn toàn kiểm soát bật/tắt bằng tay.
    # Khi CHỐT production (muốn robot tự chạy khi bật nguồn), đổi thành:
    #   restart: unless-stopped
    restart: "no"
    environment:
      <<: *ros2-env
      SERIAL_PORT: ${SERIAL_PORT:-/dev/ttyACM0}
      BAUDRATE: ${BAUDRATE:-115200}
      LIDAR_PORT: ${LIDAR_PORT:-/dev/ttyUSB0}
    devices:
      # STM32 (motor controller + odom + sonar)
      - "${SERIAL_PORT:-/dev/ttyACM0}:${SERIAL_PORT:-/dev/ttyACM0}"
      # RPLiDAR A3M1
      - "${LIDAR_PORT:-/dev/ttyUSB0}:${LIDAR_PORT:-/dev/ttyUSB0}"
      # Gamepad (joystick) - dùng để lái tay lúc build map
      - "${JOY_DEV:-/dev/input/js0}:${JOY_DEV:-/dev/input/js0}"
    volumes:
      # Lưu map RA NGOÀI container: map robot build được nằm ở host, KHÔNG mất
      # khi container tắt/update image. Trỏ vào package robot_navigation/maps.
      - ./robot_maps:/maps
    stdin_open: true
    tty: true
    # KHÔNG hardcode một launch cụ thể ở đây. Container chỉ khởi động ROS env và
    # giữ sống, để bạn linh hoạt đổi chế độ (build map / auto explore / nav) bằng
    # cách exec vào container. Camera Astra chạy NATIVE trên host (không đưa vào
    # container) và vẫn nói chuyện được nhờ network_mode: host + cùng ROS_DOMAIN_ID.
    #
    # Chạy một chế độ:
    #   docker exec -it robot-ros2 bash
    #   ros2 launch robot_control manual_mapping.launch.py \
    #     port:=$SERIAL_PORT lidar_serial_port:=$LIDAR_PORT
    command: >
      bash -c "sleep infinity"

  # ---------------------------------------------------------------- VMware --
  # Chỉ để development/debug + RViz2. KHÔNG có `devices:`, không chạy driver
  # phần cứng. Nhìn thấy topic của miniPC qua LAN nhờ network_mode: host.
  ros2-debug:
    profiles: [debug]
    build:
      context: .
      dockerfile: Dockerfile
    image: robot-ros2:dev
    container_name: ros2-debug
    network_mode: host
    restart: "no"
    environment:
      <<: *ros2-env
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      # Source mount live: sửa code trên VM rồi colcon build trong container.
      - ./ros2_ws/src:/ros2_ws/src
      - ./robot_maps:/maps
      # X11 socket của Ubuntu guest -> RViz2 hiện lên trên VM.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true
    # Không launch gì cả. Vào container rồi tự chạy rviz2 / ros2 topic echo.
    #   docker exec -it ros2-debug bash
    #   rviz2
    command: >
      bash -c "sleep infinity"
