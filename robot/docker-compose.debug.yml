# Debug compose for the Ubuntu VMware guest.
#
# This file deliberately pulls the same immutable ROS 2 image used by the
# robot miniPC. It does not build source locally and does not pass through
# STM32, LiDAR, or joystick devices.

services:
  robot-ros2-debug:
    image: ${DOCKER_IMAGE:-307sativa/robot-ros2:latest}
    container_name: robot-ros2-debug
    network_mode: host
    restart: "no"
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # Leave empty for local multicast. Set this to the same Discovery Server
      # used by the miniPC when the VM is joining the robot's ROS graph.
      ROS_DISCOVERY_SERVER: ${ROS_DISCOVERY_SERVER:-}
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      # Optional saved maps for RViz/Nav2 inspection in the VM.
      - ./robot_maps:/maps
      # RViz/Gazebo GUI is rendered by the Ubuntu VMware X server.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: >
      bash -lc "sleep infinity"
