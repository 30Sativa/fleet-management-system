# Development compose for ROS 2 Humble inside the Ubuntu VMware guest.
#
# Run from robot/ on Ubuntu, not from PowerShell on the Windows host.  The
# default service is hardware-independent and is suitable for Gazebo/RViz.
# Use --profile hardware for real STM32 + RPLiDAR mapping.

x-ros2-dev-environment: &ros2-dev-environment
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  # Empty means normal local multicast discovery. Set this to a reachable
  # Fast DDS Discovery Server only when the VM is joining an existing setup.
  ROS_DISCOVERY_SERVER: ${ROS_DISCOVERY_SERVER:-}
  DISPLAY: ${DISPLAY:-:0}
  QT_X11_NO_MITSHM: "1"
  LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}

x-ros2-dev-common: &ros2-dev-common
  build:
    context: .
    dockerfile: Dockerfile
  image: robot-ros2:dev
  network_mode: host
  restart: "no"
  environment: *ros2-dev-environment
  volumes:
    # Source is live-mounted for edit/build/test inside the dev container.
    - ./ros2_ws/src:/ros2_ws/src
    # Maps survive container recreation and image rebuilds.
    - ./robot_maps:/maps
    # RViz uses the Ubuntu VM X server. This is not a Windows Docker Desktop
    # path; Docker runs inside the Ubuntu VMware guest for this compose file.
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
  command: >
    bash -lc
    "colcon build --symlink-install
    && source /ros2_ws/install/setup.bash
    && sleep infinity"

services:
  # Simulation/RViz development. No USB device is required.
  robot-ros2-dev:
    <<: *ros2-dev-common
    container_name: robot-ros2-dev

  # Real-robot development and mapping. Enable with:
  # docker compose -f docker-compose.dev.yml --profile hardware up -d robot-ros2-dev-hardware
  robot-ros2-dev-hardware:
    <<: *ros2-dev-common
    container_name: robot-ros2-dev-hardware
    profiles: [hardware]
    environment:
      <<: *ros2-dev-environment
      SERIAL_PORT: ${SERIAL_PORT_DEV:-/dev/ttyACM0}
      BAUDRATE: ${BAUDRATE:-115200}
      LIDAR_PORT: ${LIDAR_PORT_DEV:-/dev/ttyUSB0}
    devices:
      - "${SERIAL_PORT_DEV:-/dev/ttyACM0}:${SERIAL_PORT_DEV:-/dev/ttyACM0}"
      - "${LIDAR_PORT_DEV:-/dev/ttyUSB0}:${LIDAR_PORT_DEV:-/dev/ttyUSB0}"
