teleop_twist_joy_node:
  ros__parameters:
    # Hold this button while driving. This prevents a stale joystick command
    # from moving the robot after the controller is released or disconnected.
    require_enable_button: true
    enable_button: 0
    # Typical Xbox/PlayStation mapping. Override these launch arguments if the
    # VMware joystick driver exposes a different axis order.
    axis_linear:
      x: 1
    scale_linear:
      x: 0.20
    scale_linear_turbo:
      x: 0.30
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.80
    scale_angular_turbo:
      yaw: 1.20
