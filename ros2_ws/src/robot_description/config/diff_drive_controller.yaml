# =============================================================================
# diff_drive_controller.yaml
# Cau hinh controller_manager + diff_drive_controller cho AMR.
# LUU Y: wheel_separation va wheel_radius PHAI khop URDF.
#   wheel_separation = base_width + wheel_width = 0.55 + 0.05 = 0.60
#   wheel_radius     = 0.10
# =============================================================================
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: true   # bat buoc khi chay Gazebo

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names:  ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.60
    wheel_radius: 0.10

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true

    # Nhan lenh tu /cmd_vel. Doi true neu dung TwistStamped.
    use_stamped_vel: false
    cmd_vel_timeout: 0.5  # giay

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 1.0
        min_acceleration: -1.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 2.0
        min_velocity: -2.0
        has_acceleration_limits: true
        max_acceleration: 2.0
        min_acceleration: -2.0
